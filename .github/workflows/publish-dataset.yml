name: Publish dataset archive
on:
  push:
    paths:
      - .github/workflows/publish-dataset.yml
permissions:
  contents: write
concurrency:
  group: publish-dataset
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and expand dataset archive
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://github.com/${REPOSITORY}.git" dataset
          cd dataset
          python3 - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, json, stat
          archive = Path("evidence-bound-risk-field_dataset_20261109 (1).zip")
          expected = "765f97e7e771a7b7b0c051d379a14d6fb40f40268496ba537c61812682508f8d"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, "Archive hash mismatch"
          files = []
          with ZipFile(archive) as zipped:
              for member in zipped.infolist():
                  name = member.filename
                  if not member.flag_bits & 0x800:
                      try:
                          name = name.encode("cp437").decode("utf-8")
                      except UnicodeError:
                          pass
                  rel = PurePosixPath(name)
                  assert not rel.is_absolute() and ".." not in rel.parts, name
                  assert rel.parts[0] == "evidence-bound-risk-field", name
                  assert not stat.S_ISLNK(member.external_attr >> 16), name
                  if member.is_dir():
                      continue
                  assert len(rel.parts) > 1 and ".git" not in rel.parts and ".github" not in rel.parts, name
                  destination = Path(*rel.parts[1:])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("xb") as output:
                      output.write(zipped.read(member))
                  files.append(destination)
          assert len(files) == 40, len(files)
          manifest = json.loads(Path("MANIFEST_SHA256.json").read_text())
          for item in manifest["files"]:
              data = Path(item["path"]).read_bytes()
              assert len(data) == item["bytes"], item["path"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"], item["path"]
          assert len(manifest["files"]) == 38
          archive.unlink()
          print("Verified and extracted 40 files; 38 manifest checks passed.")
          PYCODE
          sha256sum -c SHA256SUMS.txt
          git config user.name "MingLei Z"
          git config user.email "266048784+wmuminglz-max@users.noreply.github.com"
          git add --all
          git commit -m "Publish verified 2026-11-09 dataset in its original directory structure"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main
